# MySQL Connection for Port 3307
spring.datasource.url=jdbc:mysql://localhost:3307/localoot
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Logic - Automatically creates/updates tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================
# Email (SMTP) Configuration
# =========================
# If these are not set, the app will fall back to logging emails instead of sending.
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.from=no-reply@localoot.com
app.email.enabled=false

# =========================
# Payments (Stripe/Razorpay)
# =========================
app.payments.provider=MOCK  # MOCK | STRIPE | RAZORPAY
app.payments.currency=INR
app.stripe.secretKey=
app.stripe.webhookSecret=
app.razorpay.keyId=
app.razorpay.keySecret=